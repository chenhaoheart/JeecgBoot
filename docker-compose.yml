version: '2'
services:
  # MySQL、Redis、山洪库 shreport_map 使用本机已安装的实例，不在此编排。
  # 后台容器通过 host.docker.internal 访问，连接见 application-docker.yml。

  jeecg-boot-system:
    build:
      context: ./jeecg-boot/jeecg-module-system/jeecg-system-start
    restart: on-failure
    depends_on:
      - jeecg-boot-pgvector
    container_name: jeecg-boot-system
    image: jeecg-boot-system
    hostname: jeecg-boot-system
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8080:8080
    networks:
      - jeecg-boot
  jeecg-vue:
    build:
      context: ./jeecgboot-vue3
    container_name: jeecgboot-vue3-nginx
    image: jeecgboot-vue3
    depends_on:
      - jeecg-boot-system
    networks:
      - jeecg-boot
    ports:
      - 80:80

  jeecg-boot-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    container_name: jeecg-boot-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector_db
    # 本机已有 PostgreSQL 占用 5432（山洪一张图），向量库改映射 5433
    ports:
      - 5433:5432
    restart: always
    networks:
      - jeecg-boot

networks:
  jeecg-boot:
    name: jeecg_boot
