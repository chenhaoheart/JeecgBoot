version: '2'
services:
  # MySQL、Redis、山洪库 shreport_map 使用本机已安装的实例，不在此编排。
  # 后台容器通过 host.docker.internal 访问，连接见 application-docker.yml。

  jeecg-boot-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    container_name: jeecg-boot-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector_db
    # 本机已有 PostgreSQL 占用 5432，向量库映射 5433
    ports:
      - 5433:5432
    restart: always
    networks:
      - jeecg-boot
  
#  jeecg-boot-rabbitmq:
#    image: rabbitmq:3.7.7-management
##    ports:
##      - 5672:5672
##      - 15672:15672
#    restart: always
#    container_name: jeecg-boot-rabbitmq
#    hostname: jeecg-boot-rabbitmq
#    environment:
#      RABBITMQ_DEFAULT_USER: guest
#      RABBITMQ_DEFAULT_PASS: guest
#    networks:
#      - jeecg-boot

  jeecg-boot-system:
    build:
      context: ./jeecg-module-system/jeecg-system-start
    restart: on-failure
    mac_address: 02:42:ac:11:00:02
    depends_on:
      - jeecg-boot-pgvector
    container_name: jeecg-boot-system
    image: jeecg-boot-system
    hostname: jeecg-boot-system
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8080:8080
    networks:
      - jeecg-boot
    volumes:
      - ./config:/jeecg-boot/config

networks:
  jeecg-boot:
    name: jeecg_boot
